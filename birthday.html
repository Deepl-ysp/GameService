<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生日快乐，杨博宇 🎂</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --pink-light: #FFE4F3;
            --pink: #FF8EC4;
            --pink-deep: #E84A8A;
            --purple: #9B59B6;
            --gold: #FFD700;
            --text-dark: #2D1B36;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #FFE4F3 0%, #FFF0F5 50%, #E8F4FD 100%);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-dark);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 100%;
            padding: 0 20px;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 40px 20px;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(255, 142, 196, 0.3) 0%, transparent 70%);
            pointer-events: none;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            opacity: 0.9;
        }

        .confetti.circle {
            border-radius: 50%;
        }

        .confetti.square {
            border-radius: 2px;
            transform: rotate(45deg);
        }

        .confetti.star {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .birthday-text {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(3rem, 15vw, 6rem);
            background: linear-gradient(90deg, #FF69B4, #FFD700, #9B59B6, #FF69B4);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowText 3s linear infinite, bounceIn 1.5s ease-out;
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.5);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255, 105, 180, 0.8));
        }

        @keyframes rainbowText {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .name-highlight {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(2.5rem, 12vw, 5rem);
            background: linear-gradient(135deg, var(--pink-deep), var(--purple), var(--gold), var(--pink-deep));
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowRotate 5s ease infinite, shimmer 1s ease-in-out infinite;
            margin: 30px 0;
            position: relative;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.6));
        }

        @keyframes rainbowRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .name-char {
            display: inline-block;
            opacity: 0;
            animation: charReveal 0.6s ease forwards, charFloat 3s ease-in-out infinite;
        }

        @keyframes charReveal {
            0% {
                opacity: 0;
                transform: translateY(50px) rotate(-20deg) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotate(0) scale(1);
            }
        }

        @keyframes charFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.3) rotate(-10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(2deg);
            }
            70% {
                transform: scale(0.95) rotate(-1deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes shimmer {
            0%, 100% {
                filter: brightness(1) drop-shadow(0 0 30px rgba(255, 215, 0, 0.6));
            }
            50% {
                filter: brightness(1.5) drop-shadow(0 0 50px rgba(255, 215, 0, 1));
            }
        }

        .subtitle {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            color: var(--purple);
            margin: 20px 0 40px;
            letter-spacing: 8px;
            opacity: 0;
            animation: fadeInUp 1s ease 0.8s forwards, sparkle 2s ease-in-out infinite 1.8s;
            text-shadow: 0 0 20px rgba(155, 89, 182, 0.5);
        }

        @keyframes sparkle {
            0%, 100% { text-shadow: 0 0 20px rgba(155, 89, 182, 0.5); }
            50% { text-shadow: 0 0 40px rgba(155, 89, 182, 1), 0 0 60px rgba(255, 105, 180, 0.8); }
        }

        .date-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 4px 30px rgba(155, 89, 182, 0.4), 0 0 60px rgba(255, 142, 196, 0.2);
            font-size: 1rem;
            color: var(--purple);
            opacity: 0;
            animation: fadeInUp 1s ease 1.2s forwards, glowPulse 2s ease-in-out infinite 2.2s;
            border: 2px solid rgba(255, 142, 196, 0.3);
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 4px 30px rgba(155, 89, 182, 0.4), 0 0 60px rgba(255, 142, 196, 0.2); }
            50% { box-shadow: 0 4px 40px rgba(155, 89, 182, 0.6), 0 0 80px rgba(255, 142, 196, 0.5), 0 0 120px rgba(255, 215, 0, 0.3); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .scroll-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--purple);
            opacity: 0;
            animation: fadeInUp 1s ease 1.8s forwards;
        }

        .scroll-hint span {
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .scroll-arrow {
            width: 28px;
            height: 28px;
            border-right: 3px solid var(--purple);
            border-bottom: 3px solid var(--purple);
            transform: rotate(45deg);
            animation: bounce 1.5s infinite;
            filter: drop-shadow(0 0 10px rgba(155, 89, 182, 0.8));
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: rotate(45deg) translateY(0);
            }
            40% {
                transform: rotate(45deg) translateY(15px);
            }
            60% {
                transform: rotate(45deg) translateY(8px);
            }
        }

        .wishes-section {
            padding: 80px 20px;
            text-align: center;
            position: relative;
        }

        .section-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(2rem, 8vw, 3rem);
            background: linear-gradient(45deg, var(--pink-deep), var(--purple), var(--gold));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 3s ease infinite;
            margin-bottom: 40px;
            position: relative;
            display: inline-block;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .section-title::before,
        .section-title::after {
            content: '✨';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            animation: starSpin 2s linear infinite;
        }

        @keyframes starSpin {
            0% { transform: translateY(-50%) rotate(0deg) scale(1); }
            50% { transform: translateY(-50%) rotate(180deg) scale(1.3); }
            100% { transform: translateY(-50%) rotate(360deg) scale(1); }
        }

        .section-title::before {
            left: -50px;
        }

        .section-title::after {
            right: -50px;
            animation-delay: -1s;
        }

        .wish-card {
            background: linear-gradient(145deg, #ffffff, #fff5f9);
            border-radius: 24px;
            padding: 40px 30px;
            margin: 0 auto 30px;
            max-width: 360px;
            box-shadow: 0 10px 50px rgba(232, 74, 138, 0.3), inset 0 0 30px rgba(255, 215, 0, 0.1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(50px) rotate(-5deg) scale(0.9);
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 3px solid rgba(255, 142, 196, 0.3);
        }

        .wish-card.visible {
            opacity: 1;
            transform: translateY(0) rotate(0) scale(1);
        }

        .wish-card:hover {
            transform: scale(1.05) rotate(1deg);
            box-shadow: 0 15px 60px rgba(232, 74, 138, 0.5), inset 0 0 40px rgba(255, 215, 0, 0.2);
        }

        .wish-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 142, 196, 0.2), transparent, rgba(255, 215, 0, 0.2), transparent);
            transform: rotate(45deg);
            animation: shine 2s infinite;
        }

        @keyframes shine {
            0% {
                transform: rotate(45deg) translateX(-100%);
            }
            100% {
                transform: rotate(45deg) translateX(100%);
            }
        }

        .wish-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: iconBounce 2s ease-in-out infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(-5deg); }
            75% { transform: translateY(-5px) rotate(5deg); }
        }

        .wish-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-dark);
            position: relative;
            z-index: 1;
        }

        .cake-section {
            padding: 60px 20px 100px;
            text-align: center;
            position: relative;
        }

        .cake-container {
            position: relative;
            display: inline-block;
            margin: 40px 0;
            animation: cakeFloat 3s ease-in-out infinite;
        }

        @keyframes cakeFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        .cake {
            width: 200px;
            height: 160px;
            position: relative;
            margin: 0 auto;
            filter: drop-shadow(0 20px 40px rgba(232, 74, 138, 0.4));
        }

        .cake-layer {
            position: absolute;
            border-radius: 10px;
            background: linear-gradient(to bottom, #FFB6C1, #FF69B4);
        }

        .cake-layer.bottom {
            width: 180px;
            height: 60px;
            bottom: 0;
            left: 10px;
            background: linear-gradient(to bottom, #FF69B4, #DB7093);
            animation: layerGlow 2s ease-in-out infinite;
        }

        @keyframes layerGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 105, 180, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 105, 180, 0.8), 0 0 60px rgba(255, 215, 0, 0.4); }
        }

        .cake-layer.middle {
            width: 150px;
            height: 50px;
            bottom: 55px;
            left: 25px;
            background: linear-gradient(to bottom, #FFB6C1, #FF69B4);
            animation: layerGlow 2s ease-in-out infinite 0.3s;
        }

        .cake-layer.top {
            width: 120px;
            height: 45px;
            bottom: 100px;
            left: 40px;
            background: linear-gradient(to bottom, #FFC0CB, #FFB6C1);
            animation: layerGlow 2s ease-in-out infinite 0.6s;
        }

        .cake-layer.decoration {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #FFD700;
            bottom: 10px;
            animation: decorationBounce 1s ease-in-out infinite;
        }

        @keyframes decorationBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.2); }
        }

        .cake-layer.bottom .cake-layer.decoration:nth-child(1) { left: 20px; animation-delay: 0s; }
        .cake-layer.bottom .cake-layer.decoration:nth-child(2) { left: 80px; background: #FF6B6B; animation-delay: 0.3s; }
        .cake-layer.bottom .cake-layer.decoration:nth-child(3) { left: 140px; animation-delay: 0.6s; }

        .candle {
            position: absolute;
            width: 8px;
            height: 40px;
            background: linear-gradient(to right, #FF69B4, #FFB6C1);
            border-radius: 2px;
            bottom: 145px;
        }

        .candle:nth-child(1) { left: 60px; }
        .candle:nth-child(2) { left: 96px; }
        .candle:nth-child(3) { left: 132px; }

        .flame {
            position: absolute;
            width: 18px;
            height: 30px;
            background: radial-gradient(ellipse at bottom, #FFD700 0%, #FF8C00 40%, #FF4500 70%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 0.15s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 20px #FF8C00) drop-shadow(0 0 40px #FF4500);
        }

        @keyframes flicker {
            0% {
                transform: translateX(-50%) scale(1) rotate(-5deg);
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) scale(1.2) rotate(5deg);
                opacity: 0.8;
            }
        }

        .flame::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 18px;
            background: radial-gradient(ellipse at bottom, #FFFACD 0%, #FFD700 50%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            animation: innerFlicker 0.2s ease-in-out infinite alternate;
        }

        @keyframes innerFlicker {
            0% { transform: translateX(-50%) scale(0.9); }
            100% { transform: translateX(-50%) scale(1.1); }
        }

        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            animation: sparkle 1s ease-in-out infinite;
            box-shadow: 0 0 20px var(--gold), 0 0 40px var(--pink-deep);
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1) rotate(180deg);
            }
        }

        .cake-message {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(1.8rem, 7vw, 2.5rem);
            background: linear-gradient(45deg, var(--pink-deep), var(--purple), var(--gold), var(--pink-deep));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowRotate 4s ease infinite, pulse 2s ease-in-out infinite;
            margin-top: 30px;
            filter: drop-shadow(0 0 30px rgba(255, 105, 180, 0.8));
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .cta-section {
            padding: 60px 20px;
            text-align: center;
        }

        .wish-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 25px 50px;
            font-size: 1.5rem;
            font-family: 'Ma Shan Zheng', cursive;
            color: white;
            background: linear-gradient(135deg, var(--pink-deep), var(--purple), var(--pink-deep));
            background-size: 200% 200%;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 40px rgba(232, 74, 138, 0.6), 0 0 80px rgba(155, 89, 182, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: buttonGradient 3s ease infinite;
        }

        @keyframes buttonGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .wish-button:hover {
            transform: scale(1.1) rotate(-2deg);
            box-shadow: 0 12px 60px rgba(232, 74, 138, 0.8), 0 0 100px rgba(255, 215, 0, 0.5);
        }

        .wish-button:active {
            transform: scale(0.95);
        }

        .wish-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: rotate(45deg);
            animation: buttonShine 2s infinite;
        }

        @keyframes buttonShine {
            0% { transform: rotate(45deg) translateX(-100%); }
            100% { transform: rotate(45deg) translateX(100%); }
        }

        .final-message {
            margin-top: 60px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .final-text {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(1.5rem, 6vw, 2rem);
            background: linear-gradient(135deg, var(--purple), var(--pink-deep));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 2;
            animation: finalTextShimmer 2s ease-in-out infinite;
        }

        @keyframes finalTextShimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .signature {
            margin-top: 40px;
            font-size: 1rem;
            color: var(--pink-deep);
            animation: signatureFloat 3s ease-in-out infinite;
        }

        @keyframes signatureFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .footer {
            padding: 40px 20px;
            text-align: center;
            color: var(--purple);
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .floating-heart {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 4s ease-out forwards;
            z-index: 100;
            filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.8));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-50vh) scale(1.2) rotate(180deg);
            }
            100% {
                transform: translateY(-100vh) scale(0.5) rotate(360deg);
                opacity: 0;
            }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            backdrop-filter: blur(10px);
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, #ffffff, #fff5f9);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            max-width: 340px;
            transform: scale(0.5) rotate(-20deg);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 20px 80px rgba(232, 74, 138, 0.5), 0 0 100px rgba(255, 215, 0, 0.3);
            border: 4px solid rgba(255, 142, 196, 0.4);
        }

        .modal.active .modal-content {
            transform: scale(1) rotate(0deg);
        }

        .modal-emoji {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: emojiBounce 0.5s ease infinite alternate, emojiRotate 2s linear infinite;
        }

        @keyframes emojiBounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-20px) scale(1.2); }
        }

        @keyframes emojiRotate {
            0% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
            100% { transform: rotate(-10deg); }
        }

        .modal-text {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2rem;
            background: linear-gradient(45deg, var(--pink-deep), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: modalTextGlow 2s ease-in-out infinite;
        }

        @keyframes modalTextGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5) drop-shadow(0 0 30px rgba(255, 105, 180, 1)); }
        }

        .modal-subtext {
            color: var(--purple);
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .modal-close {
            margin-top: 25px;
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--pink-deep), var(--purple));
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.2rem;
            font-family: 'Ma Shan Zheng', cursive;
            box-shadow: 0 5px 20px rgba(232, 74, 138, 0.5);
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(232, 74, 138, 0.7);
        }

        .firework {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes fireworkExplode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        .star-bg {
            position: fixed;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: starTwinkle 2s ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.5);
                box-shadow: 0 0 10px white, 0 0 20px var(--gold);
            }
        }

        .balloon {
            position: fixed;
            font-size: 3rem;
            pointer-events: none;
            z-index: 50;
            animation: balloonFloat 15s linear infinite;
        }

        @keyframes balloonFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
            }
        }

        @media (min-width: 768px) {
            .wish-card {
                max-width: 400px;
            }
            .cake {
                width: 250px;
                height: 200px;
            }
            .cake-layer.bottom {
                width: 220px;
                height: 75px;
                left: 15px;
            }
            .cake-layer.middle {
                width: 180px;
                height: 60px;
                bottom: 70px;
                left: 35px;
            }
            .cake-layer.top {
                width: 140px;
                height: 55px;
                bottom: 125px;
                left: 55px;
            }
            .candle {
                height: 50px;
                bottom: 180px;
            }
            .candle:nth-child(1) { left: 75px; }
            .candle:nth-child(2) { left: 121px; }
            .candle:nth-child(3) { left: 167px; }
        }
    </style>
</head>
<body>
    <div class="confetti-container" id="confettiContainer"></div>
    <div id="starsContainer"></div>
    <div id="balloonsContainer"></div>

    <section class="hero">
        <div class="birthday-text">🎂 生日快乐 🎂</div>
        <div class="name-highlight" id="nameContainer"></div>
        <div class="subtitle">HAPPY BIRTHDAY</div>
        <div class="date-badge">
            <span>📅</span>
            <span>2026年5月15日</span>
        </div>
        <div class="scroll-hint">
            <span>向下滑动</span>
            <div class="scroll-arrow"></div>
        </div>
    </section>

    <section class="wishes-section">
        <h2 class="section-title">温馨祝福</h2>
        <div class="wish-card">
            <div class="wish-icon">🌸</div>
            <p class="wish-text">愿你的每一天都如樱花般绚烂，笑容永远灿烂如阳光。</p>
        </div>
        <div class="wish-card">
            <div class="wish-icon">🌟</div>
            <p class="wish-text">愿所有美好的愿望都能成真，幸福永远围绕在你身边。</p>
        </div>
        <div class="wish-card">
            <div class="wish-icon">💝</div>
            <p class="wish-text">新的一岁，愿你遇见更多的惊喜与感动，被世界温柔以待。</p>
        </div>
    </section>

    <section class="cake-section">
        <h2 class="section-title">许下心愿</h2>
        <div class="cake-container">
            <div class="cake">
                <div class="cake-layer bottom">
                    <div class="cake-layer decoration"></div>
                    <div class="cake-layer decoration"></div>
                    <div class="cake-layer decoration"></div>
                </div>
                <div class="cake-layer middle"></div>
                <div class="cake-layer top"></div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
                <div class="sparkle" style="top: 70px; left: 20px; animation-delay: 0s;"></div>
                <div class="sparkle" style="top: 120px; right: 30px; animation-delay: 0.3s;"></div>
                <div class="sparkle" style="top: 50px; left: 50%; animation-delay: 0.6s;"></div>
                <div class="sparkle" style="top: 100px; left: 10px; animation-delay: 0.9s;"></div>
                <div class="sparkle" style="top: 80px; right: 10px; animation-delay: 1.2s;"></div>
            </div>
        </div>
        <p class="cake-message">🎉 许下心愿吧！🎉</p>
    </section>

    <section class="cta-section">
        <button class="wish-button" onclick="makeWish()">
            <span>✨</span>
            <span>送出祝福</span>
            <span>✨</span>
        </button>
    </section>

    <section class="final-section">
        <div class="final-message">
            <p class="final-text">
                愿你在新的一岁里<br>
                心中有光，脚下有路<br>
                所遇皆美好，所想皆如愿
            </p>
            <p class="signature">—— 来自朋友的爱 💕</p>
        </div>
    </section>

    <footer class="footer">
        <p>✨ 杨博宇 生日快乐 ✨</p>
    </footer>

    <div class="modal" id="wishModal">
        <div class="modal-content">
            <div class="modal-emoji">🎁</div>
            <p class="modal-text">祝福已送达！</p>
            <p class="modal-subtext">愿你的愿望都能实现<br>永远开心快乐！</p>
            <button class="modal-close" onclick="closeModal()">收到！</button>
        </div>
    </div>

    <script>
        const name = '杨博宇';
        const nameContainer = document.getElementById('nameContainer');

        name.split('').forEach((char, index) => {
            const span = document.createElement('span');
            span.className = 'name-char';
            span.textContent = char;
            span.style.animationDelay = `${1 + index * 0.15}s`;
            span.style.animationDelay = `${1 + index * 0.15}s, ${2 + index * 0.3}s`;
            nameContainer.appendChild(span);
        });

        const confettiColors = ['#FF69B4', '#FFB6C1', '#FFD700', '#9B59B6', '#FF6B6B', '#87CEEB', '#98FB98', '#FF69B4', '#FF1493', '#DA70D6'];
        const confettiContainer = document.getElementById('confettiContainer');

        function createConfetti() {
            const confetti = document.createElement('div');
            const types = ['circle', 'square', 'star'];
            const type = types[Math.floor(Math.random() * types.length)];
            confetti.className = `confetti ${type}`;
            
            const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
            confetti.style.backgroundColor = color;
            confetti.style.left = Math.random() * 100 + '%';
            const duration = Math.random() * 3 + 4;
            confetti.style.animation = `confettiFall ${duration}s linear forwards`;
            confetti.style.width = (Math.random() * 10 + 8) + 'px';
            confetti.style.height = confetti.style.width;
            
            confettiContainer.appendChild(confetti);
            
            setTimeout(() => {
                confetti.remove();
            }, duration * 1000);
        }

        for (let i = 0; i < 50; i++) {
            setTimeout(createConfetti, i * 100);
        }

        setInterval(createConfetti, 200);

        const starsContainer = document.getElementById('starsContainer');
        function createStar() {
            const star = document.createElement('div');
            star.className = 'star-bg';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            star.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            starsContainer.appendChild(star);
        }

        for (let i = 0; i < 100; i++) {
            createStar();
        }

        const balloonsContainer = document.getElementById('balloonsContainer');
        const balloonEmojis = ['🎈', '🎈', '🎈', '🎉', '🎊'];

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.textContent = balloonEmojis[Math.floor(Math.random() * balloonEmojis.length)];
            balloon.style.left = Math.random() * 100 + '%';
            balloon.style.animationDuration = (Math.random() * 10 + 10) + 's';
            balloon.style.animationDelay = Math.random() * 5 + 's';
            balloon.style.fontSize = (Math.random() * 20 + 30) + 'px';
            balloonsContainer.appendChild(balloon);
        }

        for (let i = 0; i < 10; i++) {
            setTimeout(createBalloon, i * 1000);
        }

        setInterval(createBalloon, 5000);

        const wishCards = document.querySelectorAll('.wish-card');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.2 });

        wishCards.forEach((card, index) => {
            card.style.transitionDelay = `${index * 0.3}s`;
            observer.observe(card);
        });

        function makeWish() {
            const btn = document.querySelector('.wish-button');
            btn.style.transform = 'scale(1.2)';
            setTimeout(() => btn.style.transform = 'scale(1)', 200);

            for (let i = 0; i < 50; i++) {
                setTimeout(() => createHeart(), i * 30);
            }

            for (let i = 0; i < 5; i++) {
                setTimeout(() => createFirework(window.innerWidth / 2, window.innerHeight / 2), i * 300);
            }

            document.getElementById('wishModal').classList.add('active');

            document.body.style.animation = 'shake 0.5s ease-in-out';
            setTimeout(() => {
                document.body.style.animation = '';
            }, 500);
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);

        function closeModal() {
            document.getElementById('wishModal').classList.remove('active');
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = ['💕', '💗', '💖', '💝', '❤️', '💘', '💓', '💞'][Math.floor(Math.random() * 8)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.bottom = '0';
            heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 5000);
        }

        function createFirework(x, y) {
            const colors = ['#FF69B4', '#FFD700', '#9B59B6', '#FF6B6B', '#87CEEB', '#FF1493'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const particles = 30;

            for (let i = 0; i < particles; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework';
                particle.style.backgroundColor = color;
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;

                const angle = (Math.PI * 2 * i) / particles;
                const velocity = Math.random() * 150 + 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;

                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.animation = `fireworkExplode ${Math.random() * 1 + 0.8}s ease-out forwards`;

                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 2000);
            }
        }

        document.addEventListener('click', (e) => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => createHeart(), i * 50);
            }
            
            if (Math.random() > 0.5) {
                createFirework(e.clientX, e.clientY);
            }
        });

        document.addEventListener('touchstart', (e) => {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => createHeart(), i * 50);
            }
            
            if (Math.random() > 0.5) {
                createFirework(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
    </script>
</body>
</html>
